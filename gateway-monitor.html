<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gateway Monitor - Newma Desktop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status.connected {
            background: #10b981;
            color: white;
        }

        .status.disconnected {
            background: #ef4444;
            color: white;
        }

        .status.connecting {
            background: #f59e0b;
            color: white;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f3f4f6;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f3f4f6;
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #6b7280;
            font-size: 14px;
        }

        .stat-value {
            color: #111827;
            font-weight: 600;
            font-size: 14px;
        }

        .log-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f3f4f6;
        }

        .log-header h2 {
            font-size: 18px;
            color: #333;
        }

        .clear-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .clear-btn:hover {
            background: #dc2626;
        }

        .log {
            background: #1f2937;
            color: #f9fafb;
            padding: 16px;
            border-radius: 8px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 13px;
            line-height: 1.6;
            max-height: 400px;
            overflow-y: auto;
        }

        .log-entry {
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #374151;
        }

        .log-entry:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .log-time {
            color: #9ca3af;
            font-size: 12px;
        }

        .log-message {
            color: #f9fafb;
            margin-top: 4px;
        }

        .log-message.info {
            color: #60a5fa;
        }

        .log-message.success {
            color: #34d399;
        }

        .log-message.error {
            color: #f87171;
        }

        .test-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: background 0.2s;
            margin-top: 12px;
            width: 100%;
        }

        .test-btn:hover {
            background: #5568d3;
        }

        .test-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .input-group {
            margin-top: 12px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            margin-top: 8px;
        }

        .empty-state {
            text-align: center;
            color: #6b7280;
            padding: 40px 20px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Gateway Monitor</h1>
            <div style="display: flex; align-items: center; gap: 12px; margin-top: 12px;">
                <span id="connectionStatus" class="status disconnected">未连接</span>
                <span style="color: #6b7280; font-size: 14px;">WebSocket: ws://localhost:18790</span>
            </div>
        </div>

        <div class="grid">
            <div class="card">
                <h2>📊 系统状态</h2>
                <div class="stat-item">
                    <span class="stat-label">连接状态</span>
                    <span class="stat-value" id="statStatus">-</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">运行时间</span>
                    <span class="stat-value" id="statUptime">-</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">最后更新</span>
                    <span class="stat-value" id="statLastUpdate">-</span>
                </div>
            </div>

            <div class="card">
                <h2>💬 消息统计</h2>
                <div class="stat-item">
                    <span class="stat-label">接收消息数</span>
                    <span class="stat-value" id="statMessagesReceived">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">发送消息数</span>
                    <span class="stat-value" id="statMessagesSent">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">错误数</span>
                    <span class="stat-value" id="statErrors">0</span>
                </div>
            </div>

            <div class="card">
                <h2>🧪 测试控制台</h2>
                <div class="input-group">
                    <input type="text" id="testMessage" placeholder="输入测试消息..." value="你好">
                </div>
                <button class="test-btn" id="sendTestBtn" disabled>发送测试消息</button>
            </div>
        </div>

        <div class="log-container">
            <div class="log-header">
                <h2>📋 实时日志</h2>
                <button class="clear-btn" id="clearLogBtn">清空日志</button>
            </div>
            <div class="log" id="logContainer">
                <div class="empty-state">等待连接...</div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let messagesReceived = 0;
        let messagesSent = 0;
        let errors = 0;
        let connectedTime = null;
        let sessionId = null;

        const elements = {
            connectionStatus: document.getElementById('connectionStatus'),
            statStatus: document.getElementById('statStatus'),
            statUptime: document.getElementById('statUptime'),
            statLastUpdate: document.getElementById('statLastUpdate'),
            statMessagesReceived: document.getElementById('statMessagesReceived'),
            statMessagesSent: document.getElementById('statMessagesSent'),
            statErrors: document.getElementById('statErrors'),
            logContainer: document.getElementById('logContainer'),
            sendTestBtn: document.getElementById('sendTestBtn'),
            testMessage: document.getElementById('testMessage'),
            clearLogBtn: document.getElementById('clearLogBtn')
        };

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTime(date) {
            return date.toLocaleTimeString('zh-CN', { hour12: false });
        }

        function updateUptime() {
            if (connectedTime) {
                const now = Date.now();
                const diff = Math.floor((now - connectedTime) / 1000);
                const minutes = Math.floor(diff / 60);
                const seconds = diff % 60;
                elements.statUptime.textContent = minutes + '分' + seconds + '秒';
            }
        }

        function addLog(message, type) {
            type = type || 'info';
            const entry = document.createElement('div');
            entry.className = 'log-entry';

            const timeDiv = document.createElement('div');
            timeDiv.className = 'log-time';
            timeDiv.textContent = formatTime(new Date());

            const msgDiv = document.createElement('div');
            msgDiv.className = 'log-message ' + type;
            msgDiv.textContent = message;

            entry.appendChild(timeDiv);
            entry.appendChild(msgDiv);

            const emptyState = elements.logContainer.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }

            elements.logContainer.appendChild(entry);
            elements.logContainer.scrollTop = elements.logContainer.scrollHeight;

            const entries = elements.logContainer.querySelectorAll('.log-entry');
            if (entries.length > 100) {
                entries[0].remove();
            }
        }

        function updateStats() {
            elements.statMessagesReceived.textContent = messagesReceived;
            elements.statMessagesSent.textContent = messagesSent;
            elements.statErrors.textContent = errors;
            elements.statLastUpdate.textContent = formatTime(new Date());
        }

        function connect() {
            updateConnectionStatus('connecting');
            addLog('正在连接到 Gateway...', 'info');

            ws = new WebSocket('ws://localhost:18790');

            ws.onopen = function() {
                connectedTime = Date.now();
                updateConnectionStatus('connected');
                addLog('✓ 已连接到 Gateway', 'success');
                elements.sendTestBtn.disabled = false;

                sendRequest('connect', {
                    type: 'mobile-app',
                    version: '1.0.0'
                });
            };

            ws.onmessage = function(event) {
                messagesReceived++;
                updateStats();

                try {
                    const data = JSON.parse(event.data);
                    addLog('收到: ' + JSON.stringify(data, null, 2), 'info');

                    if (data.type === 'event') {
                        if (data.event === 'connect.challenge') {
                            addLog('收到质询: ' + data.data.nonce, 'info');
                            sendRequest('connect.challenge', {
                                nonce: data.data.nonce,
                                response: calculateChallengeResponse(data.data.nonce)
                            });
                        } else if (data.event === 'connect.accepted') {
                            sessionId = data.data.sessionId;
                            addLog('✓ 连接已接受, 会话ID: ' + sessionId, 'success');
                            updateConnectionStatus('connected');
                        } else if (data.event === 'message.delta') {
                            // Message streaming
                        } else if (data.event === 'message.complete') {
                            addLog('✓ 消息完成', 'success');
                        }
                    } else if (data.type === 'response') {
                        if (data.id) {
                            addLog('✓ 响应: ' + data.id, 'success');
                        }
                    }
                } catch (e) {
                    addLog('解析消息失败: ' + e.message, 'error');
                }
            };

            ws.onerror = function(error) {
                errors++;
                updateStats();
                addLog('✗ WebSocket 错误', 'error');
            };

            ws.onclose = function() {
                updateConnectionStatus('disconnected');
                addLog('✗ 连接已断开', 'error');
                elements.sendTestBtn.disabled = true;
                connectedTime = null;

                setTimeout(function() {
                    if (!ws || ws.readyState === WebSocket.CLOSED) {
                        connect();
                    }
                }, 3000);
            };
        }

        function updateConnectionStatus(status) {
            elements.connectionStatus.className = 'status ' + status;
            if (status === 'connected') {
                elements.statStatus.textContent = '已连接';
            } else if (status === 'connecting') {
                elements.statStatus.textContent = '连接中...';
            } else {
                elements.statStatus.textContent = '未连接';
            }
        }

        function sendRequest(method, params) {
            params = params || {};
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                addLog('✗ 未连接到 Gateway', 'error');
                return;
            }

            const request = {
                type: 'req',
                id: 'req-' + Date.now(),
                method: method,
                params: params
            };

            ws.send(JSON.stringify(request));
            messagesSent++;
            updateStats();
            addLog('发送: ' + method, 'info');
        }

        function calculateChallengeResponse(nonce) {
            return nonce.split('').reverse().join('');
        }

        elements.sendTestBtn.addEventListener('click', function() {
            const message = elements.testMessage.value.trim();
            if (!message) {
                addLog('✗ 请输入测试消息', 'error');
                return;
            }

            sendRequest('agent', {
                runId: 'run-' + Date.now(),
                message: message
            });
        });

        elements.clearLogBtn.addEventListener('click', function() {
            elements.logContainer.innerHTML = '<div class="empty-state">日志已清空</div>';
        });

        setInterval(updateUptime, 1000);

        connect();
    </script>
</body>
</html>
